global
    log stdout format raw local0 # official image: log to stdout -> docker logs

defaults
    mode    http # Layer 7
    log     global
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Live backend state: http://localhost:8404
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s

frontend main
    bind *:8080
    default_backend split

backend split
  balance roundrobin
  server node1 node1:80 check
  server node2 node2:80 check
