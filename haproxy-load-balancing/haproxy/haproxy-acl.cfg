global
    log stdout format raw local0 # official image: log to stdout -> docker logs

defaults
    mode    http # Layer 7
    log     global
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Live backend state: http://localhost:8404
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s

frontend main
    bind *:8080

    ## ACL ##
    # ACL path prefix
    acl is_moti             path_beg -i /node-moti
    acl is_yossi            path_beg -i /node-yossi

    # ACL URL parameter
    acl is_moti_url_param   urlp(node) moti
    acl is_yossi_url_param  urlp(node) yossi

    # Use backend based on the ACLs above
    use_backend moti   if  is_moti or is_moti_url_param
    use_backend yossi  if  is_yossi or is_yossi_url_param

    default_backend split

backend split
  balance roundrobin
  server moti1 moti1:80 check
  server moti2 moti2:80 check
  server yossi1 yossi1:80 check
  server yossi2 yossi2:80 check

backend moti
  server moti1 moti1:80 check
  server moti2 moti2:80 check

backend yossi
  server yossi1 yossi1:80 check
  server yossi2 yossi2:80 check
