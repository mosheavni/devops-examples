# Reference config with more tuning options (not used by any compose file)
global
    maxconn     4000
    log stdout format raw local0

defaults
    mode        http # Layer 7
    log         global
    option      dontlognull
    option      httpclose
    option      httplog
    option      forwardfor
    option      redispatch
    timeout     connect 10s  # give up if a backend doesn't accept the connection
    timeout     client  300s
    timeout     server  300s
    maxconn     60000
    retries     3

frontend main
    bind *:8080
    default_backend split

backend split
  balance roundrobin
  server node1 node1:80 check
  server node2 node2:80 check
