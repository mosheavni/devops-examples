services:
  haproxy:
    image: haproxy:3.2
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "3000:8080" # app
      - "8404:8404" # stats page

  node1:
    image: traefik/whoami:v1.11.0
    environment:
      - WHOAMI_NAME=node1

  node2:
    image: traefik/whoami:v1.11.0
    environment:
      - WHOAMI_NAME=node2
