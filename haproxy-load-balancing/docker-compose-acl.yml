services:
  haproxy:
    image: haproxy:3.2
    volumes:
      - ./haproxy/haproxy-acl.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "3000:8080" # app
      - "8404:8404" # stats page

  moti1:
    image: traefik/whoami:v1.11.0
    environment:
      - WHOAMI_NAME=moti1

  moti2:
    image: traefik/whoami:v1.11.0
    environment:
      - WHOAMI_NAME=moti2

  yossi1:
    image: traefik/whoami:v1.11.0
    environment:
      - WHOAMI_NAME=yossi1

  yossi2:
    image: traefik/whoami:v1.11.0
    environment:
      - WHOAMI_NAME=yossi2
